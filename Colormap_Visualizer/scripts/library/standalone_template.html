<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colormap Visualizer</title>
    <style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  font: 13px "Segoe UI", Arial, sans-serif;
  color: #2b2f36;
  background: #fff;
  overflow: hidden;
}
[hidden] { display: none !important; }

#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: #eff2f6;
  border-bottom: 1px solid #c9d0da;
  flex: none;
}
.brand { font-weight: 600; margin-right: 12px; white-space: nowrap; }
#toolbar button {
  flex: none;
  white-space: nowrap;
  font: inherit;
  padding: 5px 12px;
  border: 1px solid #b4bdca;
  border-radius: 4px;
  background: #fff;
  color: inherit;
  cursor: pointer;
}
#toolbar button:hover:not(:disabled) { background: #e3e9f2; }
#toolbar button:disabled { opacity: 0.5; cursor: default; }
#toolbar button[aria-pressed="true"] { background: #1f6fd1; border-color: #1759a8; color: #fff; }
#point-size-control { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#point-size-control[hidden] { display: none; }
#point-size-select { font: inherit; padding: 4px 6px; border: 1px solid #b4bdca; border-radius: 4px; background: #fff; color: inherit; }
#vector-control, #vector-scale-control { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#vector-control[hidden], #vector-scale-control[hidden] { display: none; }
#vector-scale { width: 100px; }
#vector-scale-value { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
#hint { margin-left: 8px; color: #5b6574; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#viewport { position: relative; flex: 1; min-height: 0; background: #fff; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#viewport.label-mode #gl { cursor: crosshair; }

#label-layer, #label-lines { position: absolute; inset: 0; pointer-events: none; }
#label-lines { width: 100%; height: 100%; overflow: visible; }
#vector-overlay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#label-lines line { stroke-width: 1.5; }
#label-lines circle { stroke: #fff; stroke-width: 1; }
.dev-label {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  white-space: nowrap;
  cursor: move;
  pointer-events: auto;
  user-select: none;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
}
.dev-label-close {
  display: none;
  border: 0;
  padding: 0 2px;
  background: transparent;
  color: inherit;
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
}
.dev-label:hover .dev-label-close { display: block; }

#help {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 8px 12px;
  background: rgba(239, 242, 246, 0.92);
  border: 1px solid #c9d0da;
  border-radius: 4px;
  line-height: 1.6;
  pointer-events: none;
}
#help .title { font-weight: 600; margin-bottom: 2px; }
#help dl { display: grid; grid-template-columns: auto auto; column-gap: 14px; margin: 0; }
#help dt { font-weight: 600; }
#help dd { margin: 0; }

#legend {
  position: absolute;
  right: 12px;
  top: 12px;
  bottom: 12px;
  width: 150px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 8px 10px 8px 12px;
  background: transparent;
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 5px #fff;
  pointer-events: none;
}
#legend .legend-bar, #legend .legend-limit, #legend .legend-input, #legend .legend-link, #legend .legend-swatch, #legend .legend-unit { pointer-events: auto; }
#legend.invalid { outline: 2px solid #d33; }
.legend-unit { margin-left: 4px; margin-bottom: 4px; border: 0; padding: 0; color: #111; background: transparent; font: inherit; cursor: pointer; }
.legend-unit:hover { text-decoration: underline; }
.legend-unit:focus-visible { outline: 2px solid #1f6fd1; outline-offset: 2px; }
.legend-swatch { width: 26px; height: 22px; flex: none; }
.legend-body { position: relative; flex: 1; min-height: 120px; width: 100%; margin: 6px 0; }
.legend-bar { position: absolute; left: 0; top: 0; width: 26px; height: 100%; }
.legend-ticks { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; }
.legend-tick { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid rgba(0, 0, 0, 0.55); width: 32px; }
.legend-tick span { position: absolute; left: 42px; top: 0; transform: translateY(-50%); font-size: 14px; white-space: nowrap; }
.legend-limit, .legend-input {
  position: absolute;
  left: 38px;
  width: 78px;
  height: 24px;
  margin: 0;
  padding: 0 4px;
  font: 600 14px "Segoe UI", Arial, sans-serif;
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
  color: #111;
  transform: translateY(-50%);
}
.legend-limit { cursor: text; border-radius: 3px; }
.legend-limit:hover { border-color: #1f6fd1; background: #fff; }
.legend-limit.upper, .legend-input.upper { top: 0; }
.legend-limit.lower, .legend-input.lower { top: 100%; }
.legend-input { border: 1px solid #1f6fd1; background: #fff; outline: none; }
.legend-link { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; line-height: 1.2; }

#btn-reset-zoom {
  position: absolute;
  left: 152px;
  bottom: 12px;
  padding: 3px 10px;
  font: inherit;
  font-size: 12px;
  border: 1px solid #b4bdca;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.75);
  color: inherit;
  cursor: pointer;
}
#btn-reset-zoom:hover { background: #fff; }

#tooltip {
  position: absolute;
  padding: 2px 8px;
  border-radius: 3px;
  background: rgba(30, 34, 40, 0.9);
  color: #fff;
  font-weight: 600;
  pointer-events: none;
  white-space: nowrap;
}

#status {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 14px 22px;
  border-radius: 6px;
  background: rgba(239, 242, 246, 0.96);
  border: 1px solid #c9d0da;
  text-align: center;
  max-width: 70%;
}
#status.error { border-color: #d33; color: #a11; }
#drop {
  position: absolute;
  inset: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px dashed #1f6fd1;
  border-radius: 8px;
  background: rgba(31, 111, 209, 0.08);
  font-size: 20px;
  color: #1f6fd1;
  pointer-events: none;
}
#stage-timeline { flex: none; min-height: 46px; background: #eff2f6; border-top: 1px solid #c9d0da; padding: 3px 8px; }
#stage-timeline[hidden] { display: none; }
.stage-buttons { display: flex; overflow-x: auto; height: 38px; }
.stage-button { flex: 1 0 34px; min-width: 34px; max-width: 52px; border: 1px solid #c9d0da; border-right: 0; background: #eff2f6; color: #2b2f36; font: inherit; cursor: pointer; }
.stage-button:last-child { border-right: 1px solid #c9d0da; }
.stage-button[aria-current="true"] { position: relative; z-index: 1; border: 2px solid #1f6fd1; background: #fff; }
.stage-ruler { position: relative; height: 40px; margin: 0 18px; touch-action: pan-y; }
.stage-ruler input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; appearance: none; background: transparent; cursor: ew-resize; }
.stage-ruler input::-webkit-slider-runnable-track { height: 100%; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(var(--tick-step) - 1px), #9ca8b8 calc(var(--tick-step) - 1px), #9ca8b8 var(--tick-step)); }
.stage-ruler input::-moz-range-track { height: 100%; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(var(--tick-step) - 1px), #9ca8b8 calc(var(--tick-step) - 1px), #9ca8b8 var(--tick-step)); }
.stage-ruler input::-webkit-slider-thumb { appearance: none; width: 2px; height: 40px; background: #0878e8; border: 0; }
.stage-ruler input::-moz-range-thumb { width: 2px; height: 40px; background: #0878e8; border: 0; border-radius: 0; }
.stage-tick-label { position: absolute; top: 21px; transform: translateX(-50%); pointer-events: none; font-size: 12px; }
.stage-current { position: absolute; left: 0; top: 4px; font-weight: 600; pointer-events: none; }

    </style>
  </head>
  <body>
    <header id="toolbar">
      <div class="brand">Colormap Visualizer</div>
      <button id="btn-labels" type="button" aria-pressed="false" title="Then Ctrl+Click on the surface to place a deviation label">Create Deviation Labels</button>
      <button id="btn-clear" type="button" disabled>Clear Labels</button>
      <label id="point-size-control" hidden>Point size
        <select id="point-size-select" aria-label="Point size">
          <option value="small">Small</option>
          <option value="medium" selected>Medium</option>
          <option value="large">Large</option>
        </select>
      </label>
      <label id="vector-control" hidden><input id="show-vectors" type="checkbox" checked /> Show displacement vectors</label>
      <label id="vector-scale-control" hidden>Vector scaling
        <input id="vector-scale" type="range" min="1" max="100" step="1" value="50" />
        <output id="vector-scale-value">50</output>
      </label>
      <span id="hint"></span>
    </header>

    <main id="viewport">
      <canvas id="gl"></canvas>
      <svg id="vector-overlay" aria-hidden="true"></svg>
      <div id="label-layer"><svg id="label-lines"></svg></div>
      <aside id="help">
        <div class="title">Navigation</div>
        <dl>
          <dt>LMB</dt><dd>Rotate</dd>
          <dt>MMB/RMB</dt><dd>Pan</dd>
          <dt>Mouse Wheel</dt><dd>Zoom</dd>
          <dt>Shift+LMB</dt><dd>Roll around view axis</dd>
        </dl>
      </aside>
      <aside id="legend"></aside>
      <button id="btn-reset-zoom" type="button" title="Zoom the model to fill the view (keeps the current orientation)">Reset zoom</button>
      <div id="tooltip" hidden></div>
      <div id="status" hidden></div>
    </main>
    <footer id="stage-timeline" hidden aria-label="Colormap stages"></footer>

// a perfectly balanced tree with a depth up to 31. Lower stack
// depth gets higher performance.
//
// However not all trees are balanced. Best value to set this to

// Utilities
uvec4 uTexelFetch1D( usampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

}

ivec4 iTexelFetch1D( isampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

}

vec4 texelFetch1D( sampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

}

vec4 textureSampleBarycoord( sampler2D tex, vec3 barycoord, uvec3 faceIndices ) {

	return
		barycoord.x * texelFetch1D( tex, faceIndices.x ) +
		barycoord.y * texelFetch1D( tex, faceIndices.y ) +
		barycoord.z * texelFetch1D( tex, faceIndices.z );

void ndcToCameraRay(
	vec2 coord, mat4 cameraWorld, mat4 invProjectionMatrix,
	out vec3 rayOrigin, out vec3 rayDirection
) {

	// get camera look direction and near plane for camera clipping
	vec4 lookDirection = cameraWorld * vec4( 0.0, 0.0, - 1.0, 0.0 );
	vec4 nearVector = invProjectionMatrix * vec4( 0.0, 0.0, - 1.0, 1.0 );
	float near = abs( nearVector.z / nearVector.w );

	// get the camera direction and position from camera matrices
	vec4 origin = cameraWorld * vec4( 0.0, 0.0, 0.0, 1.0 );
	vec4 direction = invProjectionMatrix * vec4( coord, 0.5, 1.0 );
	direction /= direction.w;
	direction = cameraWorld * direction - origin;

	// slide the origin along the ray until it sits at the near clip plane position
	origin.xyz += direction.xyz * near / dot( direction, lookDirection );

	rayOrigin = origin.xyz;
	rayDirection = direction.xyz;

}

// Raycasting
bool intersectsBounds( vec3 rayOrigin, vec3 rayDirection, vec3 boundsMin, vec3 boundsMax, out float dist ) {

	// https://www.reddit.com/r/opengl/comments/8ntzz5/fast_glsl_ray_box_intersection/
	// https://tavianator.com/2011/ray_box.html
	vec3 invDir = 1.0 / rayDirection;

	// find intersection distances for each plane
	vec3 tMinPlane = invDir * ( boundsMin - rayOrigin );
	vec3 tMaxPlane = invDir * ( boundsMax - rayOrigin );

	// get the min and max distances from each intersection
	vec3 tMinHit = min( tMaxPlane, tMinPlane );
	vec3 tMaxHit = max( tMaxPlane, tMinPlane );

	// get the furthest hit distance
	vec2 t = max( tMinHit.xx, tMinHit.yz );
	float t0 = max( t.x, t.y );

	// get the minimum hit distance
	t = min( tMaxHit.xx, tMaxHit.yz );
	float t1 = min( t.x, t.y );

	// set distance to 0.0 if the ray starts inside the box
	dist = max( t0, 0.0 );

	return t1 >= dist;

}

bool intersectsTriangle(
	vec3 rayOrigin, vec3 rayDirection, vec3 a, vec3 b, vec3 c,
	out vec3 barycoord, out vec3 norm, out float dist, out float side
) {

	// https://stackoverflow.com/questions/42740765/intersection-between-line-and-triangle-in-3d
	vec3 edge1 = b - a;
	vec3 edge2 = c - a;
	norm = cross( edge1, edge2 );

	float det = - dot( rayDirection, norm );
	float invdet = 1.0 / det;

	vec3 AO = rayOrigin - a;
	vec3 DAO = cross( AO, rayDirection );

	vec4 uvt;
	uvt.x = dot( edge2, DAO ) * invdet;
	uvt.y = - dot( edge1, DAO ) * invdet;
	uvt.z = dot( AO, norm ) * invdet;
	uvt.w = 1.0 - uvt.x - uvt.y;

	// set the hit information
	barycoord = uvt.wxy; // arranged in A, B, C order
	dist = uvt.z;
	side = sign( det );
	norm = side * normalize( norm );

	// add an epsilon to avoid misses between triangles
	uvt += vec4( TRI_INTERSECT_EPSILON );

	return all( greaterThanEqual( uvt, vec4( 0.0 ) ) );

}

bool intersectTriangles(
	// geometry info and triangle range
	sampler2D positionAttr, usampler2D indexAttr, uint offset, uint count,

	// ray
	vec3 rayOrigin, vec3 rayDirection,

	// outputs
	inout float minDistance, inout uvec4 faceIndices, inout vec3 faceNormal, inout vec3 barycoord,
	inout float side, inout float dist
) {

	bool found = false;
	vec3 localBarycoord, localNormal;
	float localDist, localSide;
	for ( uint i = offset, l = offset + count; i < l; i ++ ) {

		uvec3 indices = uTexelFetch1D( indexAttr, i ).xyz;
		vec3 a = texelFetch1D( positionAttr, indices.x ).rgb;

		if (
			intersectsTriangle( rayOrigin, rayDirection, a, b, c, localBarycoord, localNormal, localDist, localSide )
			&& localDist < minDistance

			found = true;

			faceNormal = localNormal;

			side = localSide;
			barycoord = localBarycoord;
			dist = localDist;

	}

bool _bvhIntersectFirstHit(

	inout float side, inout float dist

	// we push both the left and right child onto the stack every traversal

		float boundsHitDistance;

			uint rightIndex = boundsInfo.y;

			// traversed first

			ptr ++;
			stack[ ptr ] = c1;

		}

	}

	return found;
